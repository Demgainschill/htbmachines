### generated by vpn_sstp.py ###
[modules]
log_syslog
sstp
shaper
chap-secrets
ippool
auth_pap
auth_chap_md5
auth_mschap_v1
auth_mschap_v2

[core]
thread-count=2

[common]
single-session=replace

[log]
syslog=accel-sstp,daemon
copy=1
level=3

[client-ip-range]
0.0.0.0/0

[sstp]
verbose=1
ifname=sstp%d
port=443
accept=ssl
ssl-ca-file=/run/accel-pppd/sstp-ca.pem
ssl-pemfile=/run/accel-pppd/sstp-cert.pem
ssl-keyfile=/run/accel-pppd/sstp-cert.key
ip-pool=SSTP-POOL

[ip-pool]
gw-ip-address=10.0.0.1
10.0.0.2-100,name=SSTP-POOL





[chap-secrets]
chap-secrets=/run/accel-pppd/sstp.chap-secrets
gw-ip-address=10.0.0.1

#ppp options
[ppp]
verbose=1
check-ip=1
ccp=1
unit-preallocate=0
mppe=prefer
lcp-echo-interval=30
lcp-echo-timeout=0
lcp-echo-failure=3
ipv6=deny
ipv6-accept-peer-intf-id=0
mtu=1500





[cli]
tcp=127.0.0.1:2005