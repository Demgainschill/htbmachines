[libdefaults]
    dns_lookup_kdc = false
    dns_lookup_realm = false
    default_realm = OUTDATED.HTB

[realms]
    OUTDATED.HTB = {
        kdc = dc.outdated.htb
        admin_server = dc.outdated.htb
        default_domain = outdated.htb
    }

[domain_realm]
    .outdated.htb = OUTDATED.HTB
    outdated.htb = OUTDATED.HTB